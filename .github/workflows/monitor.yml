name: Canonbot Restock Scan

# Free 24/7-ish scanning on GitHub Actions (this repo is public, so Actions
# minutes are unlimited). Each run scans CONTINUOUSLY for ~115 minutes (Canon +
# Target every ~30s), and a new run starts every 2 hours — so coverage is
# near-continuous (~5 min gap) at $0, no server needed.
#
# GitHub can delay scheduled runs under load, so it isn't perfectly gapless.
# For zero gaps (to catch ~1-minute restocks), run it on an always-on machine.
on:
  schedule:
    - cron: '5 */2 * * *'   # every 2 hours; each run scans ~115 min (≈5 min gap)
  workflow_dispatch:         # lets you start a burst manually from the Actions tab

# Never run two bursts at once (avoids double alerts if a run starts late).
concurrency:
  group: canonbot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 118
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Remember what was in/out of stock across runs so you aren't re-alerted
      # for an item that simply stays in stock.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: canonbot-state-${{ github.run_id }}
          restore-keys: canonbot-state-

      - name: Scan continuously (~50 min)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          TARGET_API_KEY: ${{ secrets.TARGET_API_KEY }}
        run: python run.py --minutes 115 --no-startup

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: canonbot-state-${{ github.run_id }}
