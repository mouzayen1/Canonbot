name: Canonbot Restock Scan

# Free 24/7-ish scanning on GitHub Actions (this repo is public, so Actions
# minutes are unlimited). Instead of one quick check, each run scans
# CONTINUOUSLY for ~50 minutes (Canon + Target every ~45s), then the next hour's
# run picks up — near-continuous coverage at $0, no server needed.
#
# GitHub throttles scheduled runs and enforces a 5-min minimum, so coverage
# isn't perfectly gapless, but it's far tighter than a single check per run.
on:
  schedule:
    - cron: '2 * * * *'    # hourly; each run scans for ~50 minutes
  workflow_dispatch:         # lets you start a burst manually from the Actions tab

# Never run two bursts at once (avoids double alerts if a run starts late).
concurrency:
  group: canonbot-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Remember what was in/out of stock across runs so you aren't re-alerted
      # for an item that simply stays in stock.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: canonbot-state-${{ github.run_id }}
          restore-keys: canonbot-state-

      - name: Scan continuously (~50 min)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          TARGET_API_KEY: ${{ secrets.TARGET_API_KEY }}
        run: python run.py --minutes 50 --no-startup

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: canonbot-state-${{ github.run_id }}
