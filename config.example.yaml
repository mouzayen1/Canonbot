# Canonbot — restock monitor configuration
# Copy this file to `config.yaml` and edit it.
#
# Trust rules baked in by design:
#   - Only list first-party / authorized retailers here.
#   - Set `max_price` to the MSRP you refuse to go over. Alerts fire only when
#     the detected price is at or below max_price (see alert_above_max_price).

# How the monitor behaves globally.
settings:
  # Seconds between full sweeps of every product below. A random jitter of up to
  # +50% is added to each request so the traffic looks human and stays polite.
  # Minimum enforced floor is 30s — going lower gets you rate-limited/blocked and
  # is rude to the retailer. 60-120s is a good, respectful default.
  poll_interval_seconds: 90

  # Per-request timeout in seconds.
  request_timeout_seconds: 20

  # If true, you also get an alert when an item is in stock but ABOVE your
  # max_price (clearly flagged as over-budget). If false (default), over-MSRP
  # restocks are logged but not pushed to Discord — you only hear about it at
  # your price or better.
  alert_above_max_price: false

  # If a page loads but we can't confidently read stock status, treat it as
  # out of stock (never sends a false "in stock!" ping).
  treat_unknown_as_out_of_stock: true

# The items you're watching. Add or remove freely.
# `max_price` is YOUR ceiling for that item (typically MSRP).
products:
  - name: "Canon PowerShot G7 X Mark III (Black)"
    max_price: 879.99
    urls:
      - https://www.usa.canon.com/shop/p/powershot-g7-x-mark-iii
      - https://www.bestbuy.com/product/canon-powershot-g7-x-mark-iii-20-1-megapixel-digital-camera-black/J7C86S93T6
      - https://www.target.com/p/canon-powershot-g7-x-mark-iii-20-1-megapixel-digital-camera-black/-/A-91467769
      # Add your B&H product URL here once you have it, e.g.:
      # - https://www.bhphotovideo.com/c/product/XXXXXX-REG/canon_powershot_g7_x_mark_iii.html

  - name: "Canon PowerShot SX740 HS (Black)"
    max_price: 399.99
    urls:
      - https://www.bestbuy.com/product/canon-powershot-sx740-hs-20-3-megapixel-digital-camera-black/J7C86SSQCY
      - https://www.walmart.com/ip/Canon-PowerShot-SX740-HS-4x-20-3-Megapixel-CMOS-Digital-Camera-New-Black/605041208
      # Canon sells this refurbished; add that URL if a refurb at your price is acceptable:
      # - https://www.usa.canon.com/shop/p/refurbished-powershot-sx740-hs-black
