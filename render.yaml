# Deploy Canonbot as an always-on Render worker (same style as Trend Radar).
# Canon + Target are read via plain JSON APIs (no browser), so this uses Render's
# native Python runtime — no Docker needed. config.yaml is committed, so the
# worker has your watch list. Set DISCORD_WEBHOOK_URL in the dashboard.
#
# NOTE: Render Background Workers are a paid instance type (~$7/mo). There is no
# free worker tier. For a free option, run `python run.py` on a computer you
# leave on, or use the GitHub Actions workflow (slower, ~hourly).
services:
  - type: worker
    name: canonbot
    runtime: python
    plan: starter            # workers have no free plan; starter is ~$7/mo
    buildCommand: pip install -r requirements.txt
    startCommand: python -u run.py
    envVars:
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_MENTION
        sync: false
      - key: BESTBUY_API_KEY
        sync: false
      - key: TARGET_API_KEY
        sync: false
      - key: DISCORD_USERNAME
        sync: false
      - key: DISCORD_AVATAR_URL
        sync: false
