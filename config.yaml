# Canonbot watch list. Committed so CI (GitHub Actions) and Render have it.
# No secrets here — the Discord webhook and API keys live in .env / repo secrets.
# See config.example.yaml for every option.

settings:
  poll_interval_seconds: 90
  # Priority listings (Canon + Target) are checked this often. 30s is the floor —
  # fast enough to catch short restock windows without hammering the APIs.
  priority_poll_interval_seconds: 30
  request_timeout_seconds: 20
  max_backoff_seconds: 900
  heartbeat_hours: 12
  degraded_alert_after_minutes: 60
  alert_above_max_price: false
  treat_unknown_as_out_of_stock: true

products:
  - name: "Canon PowerShot G7 X Mark III (Black)"
    max_price: 879.99
    urls:
      - url: https://www.target.com/p/canon-powershot-g7-x-mark-iii-20-1-megapixel-digital-camera-black/-/A-91467769
        priority: true
      - url: https://www.usa.canon.com/shop/p/powershot-g7-x-mark-iii
        priority: true

  # Canon's NEW SX740 HS now lists at ~$549.99 (above the old $399.99 MSRP), and
  # the refurbished one at ~$439.99. Cap is set to $549.99 so you get alerted on
  # either — lower max_price if you only want to hear about it under a set price.
  - name: "Canon PowerShot SX740 HS (Black)"
    max_price: 549.99
    urls:
      - url: https://www.usa.canon.com/shop/p/powershot-sx740-hs
        priority: true
      - url: https://www.usa.canon.com/shop/p/refurbished-powershot-sx740-hs-black
        priority: true
